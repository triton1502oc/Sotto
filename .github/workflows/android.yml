name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      r8: ${{ steps.diff.outputs.r8 }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Classify changed files
      id: diff
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
          files="app/"
        else
          files=$(git diff --name-only "$BASE" HEAD)
        fi
        # Any change outside docs/assets requires the Gradle job
        echo "code=$(echo "$files" | grep -qvE '(\.md$|^docs/|^assets/|^\.local/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
        # Release (R8/ProGuard) build needed when shrinker/build config changes
        echo "r8=$(echo "$files" | grep -qE '(proguard|\.gradle(\.kts)?$|libs\.versions\.toml|gradle\.properties)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  security-scan:
    name: Security & Secret Leak Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-check:
    name: Documentation Sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5

    - name: Verify Documentation Sync
      run: ./scripts/sync_docs.sh --check

  build:
    name: Test, Lint & Debug Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v5

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Unit Tests, Lint & Debug APK
      run: ./gradlew testDebugUnitTest lintDebug assembleDebug --parallel --build-cache

    - name: Upload Debug APK
      uses: actions/upload-artifact@v7
      with:
        name: Sotto-debug
        path: app/build/outputs/apk/debug/*.apk

  release-build:
    name: Release Build (R8 / ProGuard)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.r8 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v5

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK (Verify ProGuard / R8)
      run: ./gradlew assembleRelease --parallel --build-cache
