name: Release APK & Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Release APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Extract Release Notes from CHANGELOG
        id: extract_notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 -c "
          import os, re
          tag = os.environ.get('TAG_NAME', '').lstrip('v')
          if os.path.exists('CHANGELOG.md'):
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = r'## \[v?' + re.escape(tag) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
                  # Remove the ### Assets section from the body if present to avoid duplicating the GitHub release asset list
                  notes = re.sub(r'### Assets\s*\n.*?(?=\n###|\Z)', '', notes, flags=re.DOTALL).strip()
                  with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
                      out.write(notes + '\n')
          "
          if [ -f RELEASE_NOTES.md ]; then
            echo "has_notes=true" >> $GITHUB_OUTPUT
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.extract_notes.outputs.has_notes == 'true' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ steps.extract_notes.outputs.has_notes != 'true' }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
