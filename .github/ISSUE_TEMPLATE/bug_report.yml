name: Bug Report
description: Report a bug, crash, or unexpected behavior in Sotto
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Sotto! Please provide as much detail as possible to help us reproduce and resolve the issue.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Clear steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Tap on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device & Environment
      description: Android version, device model, and TTS engine used.
      value: |
        - **Device**: [e.g. Google Pixel 7, Samsung Galaxy S23]
        - **Android Version**: [e.g. Android 14 (API 34)]
        - **Sotto Version**: [e.g. v1.5.7]
        - **TTS Engine**: [e.g. Google Speech Recognition & Synthesis, Samsung TTS]
        - **Active Language / Voice**: [e.g. English (US), Indonesian]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logcat / Error Trace
      description: If applicable, add logcat outputs or error stack traces.
      render: shell
    validations:
      required: false
